server:
  port: 8093

spring:
  application:
    name: http-service

# Eureka
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# HTTP Client Configuration
http:
  client:
    connect-timeout: 10000
    read-timeout: 30000
    max-retries: 3